spring.application.name=tarea-mcp

# --- Servidor MCP (Spring AI) ---
spring.ai.mcp.server.name=tarea-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

server.port=8088

# --- MySQL ---
# PWD_UDEA (clave) y MYSQL_PORT (opcional, por defecto 3306) se leen de variables de entorno.
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/tareas_mcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql se ejecuta manualmente con el cliente mysql (Parte A), no al arrancar.
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Logs ---
logging.file.name=./logs/tareas-mcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG
