<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Canasto · Pedidos a domicilio</title>
  <style>
    :root {
      --bg: #f4f6f2;
      --panel: #ffffff;
      --text: #1d2a1f;
      --muted: #607064;
      --brand: #2f7d4a;
      --brand-strong: #236239;
      --brand-soft: #e3f1e7;
      --bot: #ffffff;
      --user: #2f7d4a;
      --user-text: #ffffff;
      --border: #dde5dd;
      --chip: #eef3ee;
      --tool: #fff4dc;
      --tool-text: #7a5600;
      --error: #b3261e;
      --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111713;
        --panel: #182019;
        --text: #e5ece6;
        --muted: #93a596;
        --brand: #4fae6e;
        --brand-strong: #6cc489;
        --brand-soft: #1f3326;
        --bot: #1d2720;
        --user: #2f7d4a;
        --user-text: #ffffff;
        --border: #2a362d;
        --chip: #223026;
        --tool: #3a2f12;
        --tool-text: #f3cf7a;
        --error: #ff8a80;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center;
    }
    .app { width: 100%; max-width: 820px; height: 100%; display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      background: var(--brand); color: #fff; font-size: 22px; flex: none;
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 0; font-size: 13px; color: var(--muted); }
    header .spacer { flex: 1; }
    button.ghost {
      border: 1px solid var(--border); background: transparent; color: var(--text);
      padding: 8px 12px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13px;
    }
    button.ghost:hover { background: var(--chip); }
    #mensajes { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
    .fila { display: flex; flex-direction: column; max-width: 85%; }
    .fila.usuario { align-self: flex-end; align-items: flex-end; }
    .fila.bot { align-self: flex-start; }
    .burbuja {
      padding: 10px 14px; border-radius: 16px; box-shadow: var(--shadow); word-wrap: break-word;
    }
    .usuario .burbuja { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .bot .burbuja { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .bot .burbuja.error { color: var(--error); }
    .burbuja p { margin: 0 0 6px; }
    .burbuja p:last-child { margin-bottom: 0; }
    .burbuja ul { margin: 4px 0 6px; padding-left: 20px; }
    .herramientas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .herramienta {
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--tool); color: var(--tool-text); padding: 1px 8px; border-radius: 999px;
    }
    .aprobacion {
      margin-top: 8px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--brand);
      background: var(--brand-soft); max-width: 420px;
    }
    .aprobacion .titulo { font-weight: 600; margin-bottom: 4px; }
    .aprobacion ul { margin: 4px 0 8px; padding-left: 18px; font-size: 14px; }
    .aprobacion .dato { font-size: 14px; }
    .aprobacion .nota { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .aprobacion .acciones { display: flex; gap: 8px; margin-top: 10px; }
    .aprobacion button {
      border-radius: 10px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .aprobacion .aprobar { border: 0; background: var(--brand); color: #fff; }
    .aprobacion .aprobar:hover { background: var(--brand-strong); }
    .aprobacion .rechazar { border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    .aprobacion button:disabled { opacity: .5; cursor: default; }
    .aprobacion .estado { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .escribiendo span {
      display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
      background: var(--muted); animation: salto 1.2s infinite ease-in-out;
    }
    .escribiendo span:nth-child(2) { animation-delay: .15s; }
    .escribiendo span:nth-child(3) { animation-delay: .3s; }
    @keyframes salto { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
    .sugerencias { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
    .sugerencias button {
      border: 1px solid var(--border); background: var(--chip); color: var(--text);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .sugerencias button:hover { border-color: var(--brand); }
    form {
      display: flex; gap: 10px; padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--panel);
    }
    textarea {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      font: inherit; color: var(--text); background: var(--bg); max-height: 140px;
    }
    textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    button.enviar {
      border: 0; border-radius: 12px; padding: 0 18px; background: var(--brand); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button.enviar:hover { background: var(--brand-strong); }
    button.enviar:disabled { opacity: .5; cursor: default; }
    @media (max-width: 520px) {
      .fila { max-width: 92%; }
      header p { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">🧺</div>
    <div>
      <h1>Supermercado El Canasto</h1>
      <p>Asistente de pedidos a domicilio · conectado por MCP</p>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="nueva" type="button">Nueva conversación</button>
  </header>

  <main id="mensajes" aria-live="polite"></main>

  <div class="sugerencias" id="sugerencias">
    <button type="button">Hola, quiero hacer un pedido</button>
    <button type="button">¿Qué categorías tienen?</button>
    <button type="button">¿Cuánto cuesta el domicilio?</button>
    <button type="button">Quiero ver mis pedidos anteriores</button>
  </div>

  <form id="formulario">
    <textarea id="entrada" rows="1" maxlength="1000" placeholder="Escribe tu mensaje…" aria-label="Mensaje"></textarea>
    <button class="enviar" id="enviar" type="submit">Enviar</button>
  </form>
</div>

<script>
  const CLAVE = 'canasto-conversacion';
  const mensajes = document.getElementById('mensajes');
  const entrada = document.getElementById('entrada');
  const enviar = document.getElementById('enviar');

  function leerId() {
    try { return localStorage.getItem(CLAVE); } catch { return null; }
  }
  function guardarId(id) {
    try { localStorage.setItem(CLAVE, id); } catch { /* sin almacenamiento: la conversación dura lo que la pestaña */ }
  }
  let conversacionId = leerId() || crypto.randomUUID();
  guardarId(conversacionId);

  // Markdown mínimo y seguro: primero se escapa el HTML, luego listas, párrafos, negritas e itálicas.
  function escapar(t) {
    return t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function enLinea(t) {
    return t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }
  function markdown(texto) {
    const lineas = escapar(texto).split('\n');
    let html = '', enLista = false;
    for (const linea of lineas) {
      const item = linea.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
      if (item) {
        if (!enLista) { html += '<ul>'; enLista = true; }
        html += `<li>${enLinea(item[1])}</li>`;
      } else {
        if (enLista) { html += '</ul>'; enLista = false; }
        if (linea.trim()) html += `<p>${enLinea(linea)}</p>`;
      }
    }
    return html + (enLista ? '</ul>' : '');
  }

  function agregar(rol, contenido, { herramientas = [], error = false, html = false } = {}) {
    const fila = document.createElement('div');
    fila.className = `fila ${rol}`;
    const burbuja = document.createElement('div');
    burbuja.className = 'burbuja' + (error ? ' error' : '');
    if (html) burbuja.innerHTML = contenido; else burbuja.textContent = contenido;
    fila.appendChild(burbuja);
    if (herramientas.length) {
      const caja = document.createElement('div');
      caja.className = 'herramientas';
      caja.title = 'Herramientas MCP invocadas por el modelo';
      for (const h of herramientas) {
        const chip = document.createElement('span');
        chip.className = 'herramienta';
        chip.textContent = '⚙ ' + h;
        caja.appendChild(chip);
      }
      fila.appendChild(caja);
    }
    mensajes.appendChild(fila);
    mensajes.scrollTop = mensajes.scrollHeight;
    return fila;
  }

  const pesos = n => '$' + Number(n).toLocaleString('es-CO');

  // Tarjeta de aprobación: confirmarPedido y cancelarPedido solo se ejecutan si el cliente pulsa Aprobar.
  // Todos los datos se insertan con textContent (nunca como HTML).
  function tarjetaDeAprobacion(fila, a) {
    const caja = document.createElement('div');
    caja.className = 'aprobacion';
    const titulo = document.createElement('div');
    titulo.className = 'titulo';
    titulo.textContent = a.titulo;
    caja.appendChild(titulo);
    const lista = document.createElement('ul');
    for (const l of a.lineas || []) {
      const li = document.createElement('li');
      li.textContent = l;
      lista.appendChild(li);
    }
    caja.appendChild(lista);
    const datos = [['Total', pesos(a.total)]];
    if (a.metodoPago) datos.push(['Pago', a.metodoPago + ' contra entrega']);
    if (a.direccion) datos.push(['Dirección', a.direccion]);
    for (const [k, v] of datos) {
      const d = document.createElement('div');
      d.className = 'dato';
      const b = document.createElement('strong');
      b.textContent = k + ': ';
      d.append(b, v);
      caja.appendChild(d);
    }
    const acciones = document.createElement('div');
    acciones.className = 'acciones';
    const aprobar = document.createElement('button');
    aprobar.className = 'aprobar';
    aprobar.type = 'button';
    aprobar.textContent = 'Aprobar';
    const rechazar = document.createElement('button');
    rechazar.className = 'rechazar';
    rechazar.type = 'button';
    rechazar.textContent = 'Rechazar';
    acciones.append(aprobar, rechazar);
    caja.appendChild(acciones);
    const nota = document.createElement('div');
    nota.className = 'nota';
    nota.textContent = 'Esta acción solo se ejecuta si la apruebas aquí. El asistente no puede aprobarla por ti.';
    caja.appendChild(nota);

    async function decidir(si) {
      aprobar.disabled = rechazar.disabled = true;
      try {
        const r = await fetch('/api/chat/' + encodeURIComponent(conversacionId) + '/aprobaciones/' + encodeURIComponent(a.id), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ aprobar: si })
        });
        const d = await r.json();
        const estado = document.createElement('div');
        estado.className = 'estado';
        if (!r.ok) {
          estado.textContent = 'No disponible';
          caja.appendChild(estado);
          agregar('bot', d.error || 'Error inesperado', { error: true });
          return;
        }
        estado.textContent = si ? '✓ Aprobado por ti' : '✕ Rechazado por ti';
        caja.appendChild(estado);
        agregar('bot', markdown(d.respuesta || ''), { html: true, herramientas: d.herramientas || [] });
      } catch (e) {
        aprobar.disabled = rechazar.disabled = false;
        agregar('bot', e.message || 'No pude conectarme con el asistente.', { error: true });
      }
    }
    aprobar.addEventListener('click', () => decidir(true));
    rechazar.addEventListener('click', () => decidir(false));
    fila.appendChild(caja);
    mensajes.scrollTop = mensajes.scrollHeight;
  }

  function bienvenida() {
    agregar('bot', markdown('¡Hola! Soy el asistente de **Supermercado El Canasto**. Puedo ayudarte a armar un pedido a domicilio, consultar precios o revisar tus pedidos. Para empezar, ¿me compartes tu número de celular?'), { html: true });
  }

  async function mandar(texto) {
    texto = texto.trim();
    if (!texto || enviar.disabled) return;
    document.getElementById('sugerencias').style.display = 'none';
    agregar('usuario', texto);
    entrada.value = '';
    entrada.style.height = 'auto';
    enviar.disabled = true;
    const espera = agregar('bot', '<span class="escribiendo"><span></span><span></span><span></span></span>', { html: true });
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversacionId, mensaje: texto })
      });
      const datos = await r.json();
      espera.remove();
      if (!r.ok) {
        // Aun con error se muestran las herramientas que alcanzaron a ejecutarse en el servidor.
        const filaError = agregar('bot', datos.error || 'Error inesperado', { error: true, herramientas: datos.herramientas || [] });
        if (datos.aprobacion) tarjetaDeAprobacion(filaError, datos.aprobacion);
        return;
      }
      const fila = agregar('bot', markdown(datos.respuesta || ''), { html: true, herramientas: datos.herramientas || [] });
      if (datos.aprobacion) tarjetaDeAprobacion(fila, datos.aprobacion);
    } catch (e) {
      espera.remove();
      agregar('bot', e.message || 'No pude conectarme con el asistente.', { error: true });
    } finally {
      enviar.disabled = false;
      entrada.focus();
    }
  }

  document.getElementById('formulario').addEventListener('submit', e => { e.preventDefault(); mandar(entrada.value); });
  entrada.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); mandar(entrada.value); }
  });
  entrada.addEventListener('input', () => {
    entrada.style.height = 'auto';
    entrada.style.height = Math.min(entrada.scrollHeight, 140) + 'px';
  });
  document.querySelectorAll('#sugerencias button').forEach(b => b.addEventListener('click', () => mandar(b.textContent)));
  document.getElementById('nueva').addEventListener('click', async () => {
    try { await fetch('/api/chat/' + encodeURIComponent(conversacionId), { method: 'DELETE' }); } catch { /* ignorar */ }
    conversacionId = crypto.randomUUID();
    guardarId(conversacionId);
    mensajes.innerHTML = '';
    document.getElementById('sugerencias').style.display = '';
    bienvenida();
  });

  bienvenida();
  entrada.focus();
</script>
</body>
</html>
