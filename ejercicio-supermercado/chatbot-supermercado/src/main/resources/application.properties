spring.application.name=chatbot-supermercado

# La interfaz web del chatbot: http://localhost:8091 (solo loopback)
server.address=127.0.0.1
server.port=8091

# --- Modelo de lenguaje: Gemini (la clave se lee de GOOGLE_API_KEY, nunca va en el código) ---
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.6-flash}
spring.ai.google.genai.chat.options.temperature=0.3
# Tiempo máximo por llamada al modelo (ver GeminiConfig). Los reintentos los hace el SDK, no Spring AI:
# reintentar el turno completo podría ejecutar dos veces una herramienta (p. ej. agregarProducto).
chatbot.gemini.timeout=150s
spring.ai.retry.max-attempts=1

# --- Cliente MCP: se conecta al MCP Server del supermercado por Streamable HTTP ---
spring.ai.mcp.client.name=chatbot-supermercado
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.supermercado.url=http://localhost:8090
spring.ai.mcp.client.streamable-http.connections.supermercado.endpoint=/mcp

logging.level.org.springframework.ai=INFO
logging.level.com.udea.chatbot_supermercado=DEBUG
