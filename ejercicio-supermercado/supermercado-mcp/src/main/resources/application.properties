spring.application.name=supermercado-mcp

# --- Servidor MCP (Spring AI, transporte Streamable HTTP) ---
spring.ai.mcp.server.name=supermercado-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Herramientas de un supermercado a domicilio: catálogo, clientes y pedidos. Precios en pesos colombianos (COP). El pago es contra entrega.

# Solo en loopback: no se expone a la red local (mitigación de la actividad 16 del laboratorio).
server.address=127.0.0.1
server.port=8090

# --- MySQL (PWD_UDEA y MYSQL_PORT se leen del entorno) ---
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/supermercado?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}

# El esquema y el catálogo se cargan con schema.sql (manual); Hibernate solo valida que coincidan.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.file.name=./logs/supermercado-mcp.log
logging.level.org.springframework.ai=INFO
